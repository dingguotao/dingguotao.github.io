<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面目录 | 大数据部落</title>
<meta name="description" content="存放于 source/html/ 下的独立 HTML 页面索引">
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --text:#1f2328; --muted:#6b7280;
    --line:#e5e7eb; --accent:#0b6bcb; --accent-soft:#eaf2fd;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16181d; --card:#1e2027; --text:#e6e8eb; --muted:#9aa1ab; --line:#2c2f37; --accent:#5aa4f0; --accent-soft:#1c2733; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:48px 20px 72px; background:var(--bg); color:var(--text);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto}
  header{margin-bottom:28px}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .bar{display:flex;gap:12px;align-items:center;margin:26px 0 14px}
  input[type=search]{
    flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--text);font-size:14px;outline:none;
  }
  input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .count{color:var(--muted);font-size:13px;white-space:nowrap}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .item{
    display:flex;gap:16px;align-items:flex-start;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;transition:border-color .15s,transform .15s;
  }
  .item:hover{border-color:var(--accent);transform:translateY(-1px)}
  .day{
    flex:0 0 84px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px;color:var(--muted);padding-top:2px;letter-spacing:-.02em;
  }
  .body{flex:1;min-width:0}
  .link{color:var(--accent);text-decoration:none;font-weight:600;font-size:16.5px;word-break:break-word}
  .link:hover{text-decoration:underline}
  .desc{margin:6px 0 0;color:var(--muted);font-size:14px}
  .meta{margin-top:8px;color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
  .dot{opacity:.5}
  .empty{color:var(--muted);padding:28px 0;text-align:center;font-size:14px}
  .empty code{background:var(--accent-soft);padding:2px 6px;border-radius:5px;font-size:13px}
  footer{margin-top:36px;color:var(--muted);font-size:12.5px;text-align:center}
  .hidden{display:none}
  @media (max-width:520px){
    .item{flex-direction:column;gap:4px}
    .day{flex:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>页面目录</h1>
    <p class="sub">放在 <code>source/html/年/月/日/</code> 下的独立 HTML 页面，构建时自动收录。</p>
  </header>
  <div class="bar">
    <input type="search" id="q" placeholder="搜索标题、日期或路径…" autocomplete="off">
    <span class="count" id="c">1 个页面</span>
  </div>
  <ul id="list">
    
      <li class="item" data-search="技能增删自测 2025/01/01/selftest/index.html 一句话说明这页是什么，会显示在目录页的标题下方。 标签一 标签二 标签三">
        <time class="day" datetime="2025-01-01">2025-01-01</time>
        <div class="body">
          <a class="link" href="/html/2025/01/01/selftest/">技能增删自测</a>
          <p class="desc">一句话说明这页是什么，会显示在目录页的标题下方。</p>
          <div class="meta">
            <span class="path">/html/2025/01/01/selftest/</span>
            <span class="dot">·</span><span>3.2 KB</span>
          </div>
        </div>
      </li>
  </ul>
  <footer>由 Hexo 构建时自动生成 · 最后更新 2026-11-13</footer>
</div>
<script>
  var q = document.getElementById('q');
  var items = Array.prototype.slice.call(document.querySelectorAll('.item'));
  var c = document.getElementById('c');
  q.addEventListener('input', function(){
    var v = q.value.trim().toLowerCase();
    var n = 0;
    items.forEach(function(el){
      var hit = !v || (el.getAttribute('data-search') || '').indexOf(v) > -1;
      el.classList.toggle('hidden', !hit);
      if (hit) n++;
    });
    c.textContent = n + ' 个页面';
  });
</script>
</body>
</html>
