<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>页面标题写这里</title>
<meta name="description" content="一句话说明这页是什么，会显示在目录页的标题下方。">
<meta name="keywords" content="标签一,标签二,标签三">
<meta name="category" content="未分类">
<meta name="date" content="2026-01-01">
<meta name="author" content="dingguotao">

<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --text:#1f2328; --muted:#6b7280;
    --line:#e5e7eb; --accent:#0b6bcb;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16181d; --card:#1e2027; --text:#e6e8eb; --muted:#9aa1ab;
           --line:#2c2f37; --accent:#5aa4f0; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:48px 20px 72px; background:var(--bg); color:var(--text);
    font:16px/1.75 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto}
  .back{display:inline-block;margin-bottom:22px;color:var(--muted);font-size:13.5px;text-decoration:none}
  .back:hover{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px 34px}
  h1{margin:0 0 18px;font-size:26px;line-height:1.35;letter-spacing:-.01em}
  h2{margin:32px 0 12px;font-size:19px}
  h3{margin:24px 0 10px;font-size:16.5px}
  p{margin:0 0 14px;color:#374151}
  @media (prefers-color-scheme:dark){ p{color:#b6bcc4} }
  a{color:var(--accent)}
  ul,ol{margin:0 0 16px;padding-left:22px}
  li{margin:4px 0}
  code{background:#eaf2fd;color:#0b6bcb;padding:2px 6px;border-radius:5px;
       font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  pre{background:#f2f4f7;border:1px solid var(--line);border-radius:10px;
      padding:16px;overflow:auto;margin:0 0 16px}
  pre code{background:none;color:inherit;padding:0}
  blockquote{margin:0 0 16px;padding:2px 16px;border-left:3px solid var(--line);color:var(--muted)}
  table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:15px}
  th,td{border:1px solid var(--line);padding:9px 12px;text-align:left}
  th{background:#f2f4f7;font-weight:500}
  img{max-width:100%;height:auto;border-radius:8px}
  hr{border:0;border-top:1px solid var(--line);margin:28px 0}
  @media (prefers-color-scheme:dark){
    code{background:#1c2733;color:#5aa4f0}
    pre,th{background:#23262e}
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/html/">← 返回页面目录</a>

    <article class="card">
      <h1>页面标题写这里</h1>

      <p>正文从这里开始。整份文件是独立的 HTML，不依赖任何外部资源，样式全部内联，直接发给别人也能正常打开。</p>

      <h2>小标题</h2>
      <p>支持常见的排版元素：<code>行内代码</code>、<a href="#">链接</a>、列表、表格、代码块。</p>

      <pre><code>代码块示例
第二行</code></pre>

      <table>
        <thead><tr><th>列一</th><th>列二</th></tr></thead>
        <tbody><tr><td>值</td><td>值</td></tr></tbody>
      </table>

      <blockquote>引用块示例。</blockquote>
    </article>
  </div>
</body>
</html>
