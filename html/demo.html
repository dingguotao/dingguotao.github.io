<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示例页面 · 独立 HTML 怎么放</title>
<meta name="description" content="这是一个可直接复制的模板：把它复制到 source/html/ 下改名，内容换成你自己的即可。">
<style>
  body{margin:0;padding:56px 22px;background:#f7f8fa;color:#1f2328;
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif}
  .box{max-width:720px;margin:0 auto;background:#fff;border:1px solid #e5e7eb;
    border-radius:14px;padding:36px 34px}
  h1{margin:0 0 10px;font-size:24px}
  p{color:#4b5563}
  code{background:#eaf2fd;color:#0b6bcb;padding:2px 6px;border-radius:5px;font-size:13.5px}
  ul{color:#4b5563}
  @media(prefers-color-scheme:dark){
    body{background:#16181d;color:#e6e8eb}
    .box{background:#1e2027;border-color:#2c2f37}
    p,ul{color:#9aa1ab}
    code{background:#1c2733;color:#5aa4f0}
  }
</style>
</head>
<body>
  <div class="box">
    <h1>示例页面</h1>
    <p>这是一个可以照抄的模板。想加新页面时：</p>
    <ul>
      <li>把本文件复制一份，改个文件名（比如 <code>k8s-notes.html</code>）</li>
      <li>改 <code>&lt;title&gt;</code> 和 <code>&lt;meta name="description"&gt;</code></li>
      <li>正文随便写，样式全部内联，不需要外部依赖</li>
      <li>推送后，它会自动出现在 <a href="/html/">/html/</a> 目录里，标题取自 <code>&lt;title&gt;</code></li>
    </ul>
    <p>访问地址就是 <code>https://dingguotao.github.io/html/文件名.html</code>，可以直接发给别人。</p>
  </div>
</body>
</html>
